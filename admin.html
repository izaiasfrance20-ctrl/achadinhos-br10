<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Achadinhos BR10</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;font-family:Arial,sans-serif;color:#222}.wrap{max-width:700px;margin:auto;padding:18px}.box{background:#fff;border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 2px 10px #00000010}h1{margin:0 0 15px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}input,button{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:15px}button{background:#111;color:#fff;border:0;cursor:pointer}.danger{background:#c62828}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.prod{background:#fafafa;border:1px solid #eee;border-radius:10px;overflow:hidden}.prod img{width:100%;aspect-ratio:1;object-fit:cover}.prod .inside{padding:8px}.msg{padding:10px 0;color:#c00}.hidden{display:none}.small{font-size:12px;color:#777;margin-top:8px}
</style></head><body><div class="wrap"><div id="login" class="box"><h1>🔐 Administrador</h1><input id="user" placeholder="Usuário"><br><br><input id="pass" type="password" placeholder="Senha"><br><br><button onclick="login()">Entrar</button><div id="lm" class="msg"></div></div>
<div id="panel" class="hidden"><div class="box"><div class="row"><h1 style="margin:0">Achadinhos BR10</h1><button style="max-width:110px" onclick="logout()">Sair</button></div></div>
<div class="box"><h2>Adicionar produto</h2><input id="photo" type="file" accept="image/*"><br><br><input id="link" placeholder="Cole o link do produto (https://...)"><br><br><button onclick="add()">Adicionar</button><div class="small">Você pode enviar a foto e colar o link. Só o administrador tem acesso a esta área.</div><div id="am" class="msg"></div></div>
<div class="box"><h2>Produtos</h2><div id="products" class="products"></div></div></div></div>
<script>
async function check(){let r=await fetch('/api/me');let x=await r.json();if(x.authenticated){loginUI()}else document.querySelector('#login').classList.remove('hidden')}
function loginUI(){document.querySelector('#login').classList.add('hidden');document.querySelector('#panel').classList.remove('hidden');load()}
async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:user.value,password:pass.value})});if(r.ok)loginUI();else lm.textContent='Usuário ou senha incorretos.'}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}
async function load(){let ps=await (await fetch('/api/products')).json();products.innerHTML=ps.map(p=>`<div class="prod"><img src="${p.photo}"><div class="inside"><input id="l-${p.id}" value="${p.link}"><br><br><input type="file" id="f-${p.id}" accept="image/*"><br><br><button onclick="edit('${p.id}')">Salvar</button><br><br><button class="danger" onclick="delp('${p.id}')">Excluir</button></div></div>`).join('')||'<p>Nenhum produto.</p>'}
async function add(){if(!photo.files[0]||!link.value)return am.textContent='Informe a foto e o link.';let f=new FormData();f.append('photo',photo.files[0]);f.append('link',link.value);let r=await fetch('/api/products',{method:'POST',body:f});if(r.ok){photo.value='';link.value='';am.textContent='Produto adicionado!';load()}else am.textContent='Não foi possível adicionar.'}
async function edit(id){let f=new FormData();f.append('link',document.querySelector('#l-'+id).value);let file=document.querySelector('#f-'+id).files[0];if(file)f.append('photo',file);let r=await fetch('/api/products/'+id,{method:'PUT',body:f});if(r.ok)load();else alert('Erro ao salvar.')}
async function delp(id){if(!confirm('Excluir este produto?'))return;let r=await fetch('/api/products/'+id,{method:'DELETE'});if(r.ok)load()}
check();
</script></body></html>
